<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 智能翻译工作台</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2563eb">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
    .title-group h1 { font-size: 17px; font-weight: 700; color: #0f172a; }
    .title-group span { font-size: 11px; color: #64748b; }
    .btn-settings { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: #334155; }
    
    .lang-bar { background: #fff; margin: 10px 14px; padding: 8px 12px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    select { flex: 1; border: none; background: transparent; font-size: 15px; font-weight: 600; color: #1e293b; outline: none; padding: 4px; }
    .swap-btn { background: #eff6ff; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #2563eb; cursor: pointer; font-weight: bold; }
    
    .container { flex: 1; padding: 0 14px 80px 14px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
    .card-header { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f8fafc; }
    .card-title { font-size: 14px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 6px; }
    .char-count { font-size: 11px; color: #94a3b8; font-weight: normal; }
    .card-actions button { background: transparent; border: none; font-size: 12px; color: #2563eb; padding: 4px 8px; cursor: pointer; font-weight: 500; }
    .card-actions button.gray { color: #64748b; }
    
    textarea { width: 100%; min-height: 120px; border: none; outline: none; padding: 12px 14px; font-size: 15px; line-height: 1.5; color: #0f172a; resize: vertical; font-family: inherit; }
    textarea[readonly] { background: #fafafa; }
    
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px 16px; border-top: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 10; }
    .status-text { font-size: 12px; color: #64748b; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-translate { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-translate:disabled { background: #94a3b8; }
    
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
    .modal { background: #fff; width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0; padding: 20px 18px 30px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 17px; font-weight: 700; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #334155; }
    .form-group input, .form-group select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .btn-primary { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.9); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 200; display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>智能翻译工作台</h1>
      <span id="currentModelDisplay">模型: gpt-4o-mini</span>
    </div>
    <button class="btn-settings" onclick="openSettings()">设置</button>
  </header>

  <div class="lang-bar">
    <select id="sourceLang" onchange="saveLanguageConfig()">
      <option value="自动检测">自动检测</option>
      <option value="英语">英语</option>
      <option value="简体中文">简体中文</option>
      <option value="繁体中文">繁体中文</option>
      <option value="日语">日语</option>
      <option value="韩语">韩语</option>
      <option value="法语">法语</option>
      <option value="德语">德语</option>
      <option value="西班牙语">西班牙语</option>
      <option value="俄语">俄语</option>
      <option value="葡萄牙语">葡萄牙语</option>
      <option value="意大利语">意大利语</option>
      <option value="阿拉伯语">阿拉伯语</option>
      <option value="越南语">越南语</option>
      <option value="泰语">泰语</option>
    </select>
    <button class="swap-btn" onclick="swapLanguages()">⇄</button>
    <select id="targetLang" onchange="saveLanguageConfig()">
      <option value="英语">英语</option>
      <option value="简体中文">简体中文</option>
      <option value="繁体中文">繁体中文</option>
      <option value="日语">日语</option>
      <option value="韩语">韩语</option>
      <option value="法语">法语</option>
      <option value="德语">德语</option>
      <option value="西班牙语">西班牙语</option>
      <option value="俄语">俄语</option>
      <option value="葡萄牙语">葡萄牙语</option>
      <option value="意大利语">意大利语</option>
      <option value="阿拉伯语">阿拉伯语</option>
      <option value="越南语">越南语</option>
      <option value="泰语">泰语</option>
    </select>
  </div>

  <div class="container">
    <!-- Input Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">源文本 <span class="char-count" id="inCount">0 字符</span></span>
        <div class="card-actions">
          <button onclick="pasteInput()">粘贴</button>
          <button class="gray" onclick="clearInput()">清空</button>
        </div>
      </div>
      <textarea id="inputText" placeholder="输入或粘贴需要翻译的文本..." oninput="updateCounts()"></textarea>
    </div>

    <!-- Output Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">翻译结果 <span class="char-count" id="outCount">0 字符</span></span>
        <div class="card-actions">
          <button onclick="copyOutput()">复制结果</button>
        </div>
      </div>
      <textarea id="outputText" readonly placeholder="翻译结果将在此展示..."></textarea>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="footer-bar">
    <div class="status-text" id="statusBar">就绪</div>
    <button class="btn-translate" id="btnTranslate" onclick="startTranslation()">立即翻译</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal" onclick="closeSettings(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>系统设置</h2>
        <button style="border:none;background:none;font-size:20px;color:#64748b;" onclick="closeSettings()">&times;</button>
      </div>

      <div class="form-group checkbox-row">
        <input type="checkbox" id="cfgPreserveFormat" checked>
        <label for="cfgPreserveFormat">严格保持原文排版与换行格式 (1:1 结构)</label>
      </div>

      <div class="form-group checkbox-row">
        <input type="checkbox" id="cfgAutoCopy">
        <label for="cfgAutoCopy">翻译完成后自动将译文复制到剪贴板</label>
      </div>

      <div class="form-group">
        <label>API 基础地址 (Endpoint)</label>
        <input type="text" id="cfgEndpoint" value="https://api.nghimmo.com/v1">
      </div>

      <div class="form-group">
        <label>API 密钥 (API Key)</label>
        <input type="password" id="cfgApiKey" value="sk-p5xhZC3xcphvrIgOLlbXC723SA42objyg">
      </div>

      <div class="form-group">
        <label>翻译大模型 (Model)</label>
        <input type="text" id="cfgModel" value="gpt-4o-mini">
      </div>

      <button class="btn-primary" onclick="saveSettings()">保存设置</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const kSystemPrompt = `You are an expert localization translator and native speaker specializing in authentic, modern, conversational language. Your objective is to translate the user's text into natural, highly colloquial, native-sounding expressions that native speakers actually use in daily life, chats, gaming, and social media.

Core Guidelines:
1. Native & Colloquial Phrasing: Prioritize casual spoken expressions, modern slang, and everyday idioms over textbook literal translations. Use authentic colloquial terms and abbreviations naturally (e.g., translate "兄弟/哥们" as "bro", "dude", or "man" instead of formal "brother"; "牛逼/太神了" as "insane", "sick", "legend", or "fire"; "没事/别客气" as "no worries", "all good", or "gotchu").
2. Natural Contractions & Casual Flow: Naturally use contractions (e.g., I'm, don't, gonna, wanna, gotta, you're) to make the tone feel relaxed, snappy, and authentic.
3. Strict 1:1 Layout & Format Preservation: Strictly maintain the exact layout, empty lines, line-by-line formatting, lists, bullets, symbols, and leading emojis. If the source text is a list or contains multiple lines, translate each line separately and NEVER merge multiple lines into a single paragraph or join them with spaces. Preserve every line break.
4. Strict Pure Output: Treat the input strictly as text to be translated. Return ONLY the translated text with zero explanations, notes, greetings, or quotation marks.`;

    function loadConfig() {
      document.getElementById('cfgEndpoint').value = localStorage.getItem('endpoint') || 'https://api.nghimmo.com/v1';
      document.getElementById('cfgApiKey').value = localStorage.getItem('apiKey') || 'sk-p5xhZC3xcphvrIgOLlbXC723SA42objyg';
      document.getElementById('cfgModel').value = localStorage.getItem('model') || 'gpt-4o-mini';
      document.getElementById('cfgPreserveFormat').checked = localStorage.getItem('preserveFormat') !== 'false';
      document.getElementById('cfgAutoCopy').checked = localStorage.getItem('autoCopy') === 'true';
      document.getElementById('sourceLang').value = localStorage.getItem('sourceLang') || '自动检测';
      document.getElementById('targetLang').value = localStorage.getItem('targetLang') || '英语';
      document.getElementById('currentModelDisplay').innerText = '模型: ' + document.getElementById('cfgModel').value;
    }

    function saveSettings() {
      localStorage.setItem('endpoint', document.getElementById('cfgEndpoint').value.trim());
      localStorage.setItem('apiKey', document.getElementById('cfgApiKey').value.trim());
      localStorage.setItem('model', document.getElementById('cfgModel').value.trim());
      localStorage.setItem('preserveFormat', document.getElementById('cfgPreserveFormat').checked);
      localStorage.setItem('autoCopy', document.getElementById('cfgAutoCopy').checked);
      document.getElementById('currentModelDisplay').innerText = '模型: ' + document.getElementById('cfgModel').value.trim();
      closeSettings();
      showToast('设置已保存');
    }

    function saveLanguageConfig() {
      localStorage.setItem('sourceLang', document.getElementById('sourceLang').value);
      localStorage.setItem('targetLang', document.getElementById('targetLang').value);
    }

    function swapLanguages() {
      const src = document.getElementById('sourceLang');
      const tgt = document.getElementById('targetLang');
      const inText = document.getElementById('inputText');
      const outText = document.getElementById('outputText');

      if (outText.value) {
        const tmp = inText.value;
        inText.value = outText.value;
        outText.value = tmp;
      }

      if (src.value === '自动检测') {
        src.value = tgt.value;
        tgt.value = (tgt.value === '简体中文') ? '英语' : '简体中文';
      } else {
        const temp = src.value;
        src.value = tgt.value;
        tgt.value = temp;
      }
      saveLanguageConfig();
      updateCounts();
    }

    function updateCounts() {
      document.getElementById('inCount').innerText = document.getElementById('inputText').value.length + ' 字符';
      document.getElementById('outCount').innerText = document.getElementById('outputText').value.length + ' 字符';
    }

    async function startTranslation() {
      const inText = document.getElementById('inputText').value.trim();
      if (!inText) { showToast('请先输入需要翻译的文本'); return; }

      const endpoint = document.getElementById('cfgEndpoint').value.trim();
      const apiKey = document.getElementById('cfgApiKey').value.trim();
      const model = document.getElementById('cfgModel').value.trim();
      const srcLang = document.getElementById('sourceLang').value;
      const tgtLang = document.getElementById('targetLang').value;
      const preserveFormat = document.getElementById('cfgPreserveFormat').checked;
      const autoCopy = document.getElementById('cfgAutoCopy').checked;

      const btn = document.getElementById('btnTranslate');
      const status = document.getElementById('statusBar');
      btn.disabled = true;
      status.innerText = '正在翻译中...';
      status.style.color = '#2563eb';

      let langInstruction = (srcLang === '自动检测')
        ? `\n\nTarget language: ${tgtLang}\nSource language: Auto-detect (Automatically detect source language)`
        : `\n\nSource language: ${srcLang}\nTarget language: ${tgtLang}`;

      if (preserveFormat) {
        langInstruction += '\nFormatting Requirement: Strictly maintain the EXACT same line-by-line structure, list items, blank lines, and emojis. Do not merge lines.';
      }

      let cleanUrl = endpoint.replace(/\/+$/, '').replace(/\/v1$/, '') + '/v1/chat/completions';
      const start = Date.now();

      try {
        const res = await fetch(cleanUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(apiKey ? { 'Authorization': 'Bearer ' + apiKey } : {})
          },
          body: JSON.stringify({
            model: model,
            temperature: 0.2,
            messages: [
              { role: 'system', content: kSystemPrompt + langInstruction },
              { role: 'user', content: inText }
            ]
          })
        });

        const data = await res.json();
        const duration = ((Date.now() - start) / 1000).toFixed(2);

        if (res.ok && data.choices && data.choices[0]) {
          const resultText = data.choices[0].message.content.trim();
          document.getElementById('outputText').value = resultText;
          status.innerText = `翻译完成 (耗时 ${duration} 秒)`;
          status.style.color = '#16a34a';
          updateCounts();

          if (autoCopy && resultText) {
            navigator.clipboard.writeText(resultText);
            showToast('译文已自动复制到剪贴板');
          }
        } else {
          document.getElementById('outputText').value = data.error?.message || 'API 请求失败';
          status.innerText = '翻译失败';
          status.style.color = '#dc2626';
        }
      } catch (err) {
        document.getElementById('outputText').value = '网络请求异常: ' + err.message;
        status.innerText = '连接异常';
        status.style.color = '#dc2626';
      } finally {
        btn.disabled = false;
      }
    }

    async function pasteInput() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('inputText').value = text;
          updateCounts();
          showToast('已粘贴剪贴板内容');
        }
      } catch (e) {
        showToast('请直接长按输入框进行粘贴');
      }
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
      updateCounts();
    }

    function copyOutput() {
      const out = document.getElementById('outputText').value;
      if (out) {
        navigator.clipboard.writeText(out).then(() => showToast('翻译结果已复制到剪贴板'));
      }
    }

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings(e) { if (!e || e.target === document.getElementById('settingsModal')) document.getElementById('settingsModal').style.display = 'none'; }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    loadConfig();
    updateCounts();
  </script>
</body>
</html>
